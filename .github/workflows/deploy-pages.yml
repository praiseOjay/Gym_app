name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Public Showcase & Legal Pages
        run: |
          mkdir -p _site
          cp landing.html _site/index.html
          cp privacy-policy.html _site/privacy-policy.html
          cp terms.html _site/terms.html
          cp public/favicon.svg _site/favicon.svg 2>/dev/null || true
          cp public/app-icon.svg _site/app-icon.svg 2>/dev/null || true
          echo "GitHub Pages configured: Landing Page (index.html), Privacy Policy, and Terms of Service."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
