<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141A29" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00D285" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(0, 245, 155, 0.25)" stroke-width="6" />

  <!-- Outer Plate Rim -->
  <circle cx="256" cy="256" r="210" fill="#0C101A" stroke="rgba(255, 255, 255, 0.08)" stroke-width="12" />
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#voltGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="14 8" />

  <!-- Hexagonal Core Accent -->
  <polygon points="256,106 386,181 386,331 256,406 126,331 126,181" fill="#131A26" stroke="rgba(0, 229, 255, 0.4)" stroke-width="6" />

  <!-- Central Dumbbell Icon -->
  <g filter="url(#glow)">
    <!-- Left Weight Plates -->
    <rect x="156" y="196" width="22" height="120" rx="8" fill="url(#voltGrad)" />
    <rect x="184" y="216" width="16" height="80" rx="6" fill="url(#cyanGrad)" />

    <!-- Center Handle -->
    <rect x="198" y="246" width="116" height="20" rx="6" fill="#FFFFFF" />
    <!-- Knurling Lines on Handle -->
    <line x1="226" y1="246" x2="226" y2="266" stroke="#0A0D14" stroke-width="3" />
    <line x1="236" y1="246" x2="236" y2="266" stroke="#0A0D14" stroke-width="3" />
    <line x1="246" y1="246" x2="246" y2="266" stroke="#0A0D14" stroke-width="3" />
    <line x1="256" y1="246" x2="256" y2="266" stroke="#0A0D14" stroke-width="3" />
    <line x1="266" y1="246" x2="266" y2="266" stroke="#0A0D14" stroke-width="3" />
    <line x1="276" y1="246" x2="276" y2="266" stroke="#0A0D14" stroke-width="3" />
    <line x1="286" y1="246" x2="286" y2="266" stroke="#0A0D14" stroke-width="3" />

    <!-- Right Weight Plates -->
    <rect x="312" y="216" width="16" height="80" rx="6" fill="url(#cyanGrad)" />
    <rect x="334" y="196" width="22" height="120" rx="8" fill="url(#voltGrad)" />
  </g>

  <!-- Overload AI Lightning Accent -->
  <path d="M268 132 L234 206 L262 206 L244 266 L284 192 L256 192 Z" fill="#00F59B" filter="url(#glow)" opacity="0.95" />
</svg>
